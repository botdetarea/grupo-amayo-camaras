name: Android QA APK (cloud build)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # El runner ubuntu-latest ya trae el Android SDK en $ANDROID_HOME.
      # NO se usa android-actions/setup-android porque ejecuta "sdkmanager tools",
      # paquete que Google eliminó y que hace fallar el job.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Type-check mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Lint mobile
        working-directory: mobile
        run: npm run lint

      - name: Make Gradle wrapper executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build QA APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleQa

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: grupo-amayo-qa-apk
          path: mobile/android/app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error
          retention-days: 14
